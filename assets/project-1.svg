<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" role="img" aria-label="VoxMute Archive">
<style>
text{font-family:monospace}
.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
.fade{opacity:0;animation:fade .6s ease-out forwards}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease-out forwards}
.blink{animation:blink 1s steps(2,start) infinite}
.float{animation:float 3.5s ease-in-out infinite}
.glow{animation:glow 3s ease-in-out infinite}
.sweep{animation:sweep 3.6s ease-in-out infinite}
.type{clip-path:inset(0 100% 0 0);animation:type 1s steps(34,end) forwards}
@keyframes rise{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{50%{opacity:.15}}
@keyframes float{50%{transform:translateY(-5px)}}
@keyframes glow{50%{opacity:.35}}
@keyframes sweep{from{transform:translateX(-120px)}to{transform:translateX(var(--w))}}
@keyframes type{to{clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important;clip-path:none!important}}
</style>
<rect width="900" height="64" fill="#0b0e12"/>
<rect class="draw" pathLength="1" x="1" y="1" width="898" height="62" rx="8" fill="none" stroke="#a9ff55" stroke-width="1.5" style="animation-delay:0.00s"/>
<text class="fade" x="24" y="38" font-size="14" fill="#a9ff55" style="animation-delay:0.00s">[01]</text>
<text class="rise" x="64" y="30" font-size="17" font-weight="bold" fill="#edf0ed" style="animation-delay:0.00s">VoxMute Archive</text>
<text class="rise" x="64" y="50" font-size="13" fill="#909b9e" style="animation-delay:0.20s">A scroll-driven character dossier site with live-synthesized sound.</text>
<g class="fade" style="animation-delay:0.50s"><circle class="blink" cx="750" cy="32" r="4" fill="#a9ff55"/><text x="764" y="37" font-size="13" fill="#a9ff55">REPO ↗</text></g>
<rect class="sweep" x="0" y="60" width="120" height="2" fill="#a9ff55" opacity=".7" style="--w:900px;animation-delay:0s"/>
</svg>
