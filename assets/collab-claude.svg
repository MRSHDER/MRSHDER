<svg xmlns="http://www.w3.org/2000/svg" width="440" height="190" viewBox="0 0 440 190" role="img" aria-label="Anthropic">
<style>
text{font-family:monospace}
.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
.fade{opacity:0;animation:fade .6s ease-out forwards}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease-out forwards}
.blink{animation:blink 1s steps(2,start) infinite}
.float{animation:float 3.5s ease-in-out infinite}
.glow{animation:glow 3s ease-in-out infinite}
.sweep{animation:sweep 3.6s ease-in-out infinite}
.type{clip-path:inset(0 100% 0 0);animation:type 1s steps(34,end) forwards}
@keyframes rise{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{50%{opacity:.15}}
@keyframes float{50%{transform:translateY(-5px)}}
@keyframes glow{50%{opacity:.35}}
@keyframes sweep{from{transform:translateX(-120px)}to{transform:translateX(var(--w))}}
@keyframes type{to{clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important;clip-path:none!important}}
</style>
<rect width="440" height="190" fill="#0b0e12"/>
<rect class="draw" pathLength="1" x="1" y="1" width="438" height="188" rx="10" fill="none" stroke="#a9ff55" stroke-width="2" style="animation-delay:.1s"/>
<rect class="glow" x="1" y="1" width="438" height="188" rx="10" fill="none" stroke="#a9ff55" stroke-width="1" opacity=".6" style="animation-delay:1.2s"/>
<g class="fade" style="animation-delay:.5s"><g class="float"><g transform="translate(194,24)"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0845f"/><stop offset="1" stop-color="#cf6a45"/></linearGradient></defs><rect width="52" height="52" rx="12" fill="url(#cg)"/><path d="M26.0 23.0L26.0 9.0" stroke="#fffdf8" stroke-width="4.2" stroke-linecap="round"/><path d="M27.4 23.4L32.1 14.5" stroke="#fffdf8" stroke-width="3.8" stroke-linecap="round"/><path d="M28.5 24.3L40.7 15.7" stroke="#fffdf8" stroke-width="4.2" stroke-linecap="round"/><path d="M29.0 25.6L37.9 24.3" stroke="#fffdf8" stroke-width="3.8" stroke-linecap="round"/><path d="M28.8 27.0L42.0 31.8" stroke="#fffdf8" stroke-width="4.2" stroke-linecap="round"/><path d="M28.0 28.2L34.7 35.7" stroke="#fffdf8" stroke-width="3.8" stroke-linecap="round"/><path d="M26.8 28.9L30.7 43.4" stroke="#fffdf8" stroke-width="4.2" stroke-linecap="round"/><path d="M25.4 28.9L23.5 37.7" stroke="#fffdf8" stroke-width="3.8" stroke-linecap="round"/><path d="M24.1 28.3L15.1 39.0" stroke="#fffdf8" stroke-width="4.2" stroke-linecap="round"/><path d="M23.2 27.1L13.9 30.9" stroke="#fffdf8" stroke-width="3.8" stroke-linecap="round"/><path d="M23.0 25.7L8.1 24.4" stroke="#fffdf8" stroke-width="4.2" stroke-linecap="round"/><path d="M23.5 24.3L16.2 19.1" stroke="#fffdf8" stroke-width="3.8" stroke-linecap="round"/><path d="M24.7 23.3L19.2 11.5" stroke="#fffdf8" stroke-width="4.2" stroke-linecap="round"/></g></g></g>
<text class="rise" x="220" y="124" font-size="20" font-weight="bold" fill="#edf0ed" text-anchor="middle" style="animation-delay:.8s">Claude · Anthropic</text>
<text class="fade" x="220" y="154" font-size="13" fill="#909b9e" text-anchor="middle" style="animation-delay:1.1s">Implementation · Architecture · Code iteration</text>
<rect class="sweep" x="0" y="185" width="120" height="3" fill="#a9ff55" style="--w:440px"/>
</svg>
